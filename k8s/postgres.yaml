apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fusion-postgres-pvc
  namespace: fusion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion-db
  namespace: fusion
  labels:
    app: fusion-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusion-db
  template:
    metadata:
      labels:
        app: fusion-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: fusion
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fusion-secrets
              key: database-password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: fusion-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fusion-db
  namespace: fusion
spec:
  selector:
    app: fusion-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
