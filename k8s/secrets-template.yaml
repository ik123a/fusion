apiVersion: v1
kind: Secret
metadata:
  name: fusion-secrets
  namespace: fusion
type: Opaque
stringData:
  # The database user password (used by postgres deployment and web deployment)
  database-password: "postgres-password-here"
  
  # The full connection string for Prisma. Example: postgresql://postgres:YOUR_PASSWORD@fusion-db:5432/fusion
  database-url: "postgresql://postgres:postgres-password-here@fusion-db:5432/fusion"
  
  # The connection string for Redis. Example: redis://fusion-redis:6379
  redis-url: "redis://fusion-redis:6379"
  
  # NextAuth secret used to sign session cookies
  nextauth-secret: "generate-a-long-random-string-here"
